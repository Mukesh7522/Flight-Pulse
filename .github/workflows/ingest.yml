name: FlightPulse Ingestion

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (~300s) — matches FETCH_INTERVAL
  workflow_dispatch:          # manual trigger from GitHub UI
  push:
    paths:
      - '.github/workflows/ingest.yml'   # run once whenever this file changes

permissions:
  contents: read
  actions: write              # lets the keep-alive step below re-enable this workflow

# Never let runs pile up: at most one running + one waiting. A newer waiting run
# replaces an older one. Prevents the queue from backing up if GitHub is slow.
concurrency:
  group: flightpulse-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # upsert across PgBouncer chunks can take 5-8 min

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run ingestion
        run: python ingestion/fetch_flights.py
        env:
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENSKY_CLIENT_ID:       ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET:   ${{ secrets.OPENSKY_CLIENT_SECRET }}
          PGCLIENTENCODING:        UTF8

      # GitHub disables scheduled workflows after 60 days without repo activity
      # (state "disabled_inactivity"). Re-enabling from inside a run resets that timer.
      - name: Keep schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable"
